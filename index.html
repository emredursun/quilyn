  <!-- One-time migration: backfill completedModules from quizRecords (score ≥ 70) -->
  <script>
    (function migrateLmsState() {
      try {
        var raw = localStorage.getItem('pega_lms_state');
        if (!raw) return;
        var state = JSON.parse(raw);
        if (!state || !state.userProgress) return;
        var changed = false;
        Object.keys(state.userProgress).forEach(function (trackId) {
          var tp = state.userProgress[trackId];
          if (!tp || !tp.quizRecords) return;
          if (!Array.isArray(tp.completedModules)) { tp.completedModules = []; changed = true; }
          Object.keys(tp.quizRecords).forEach(function (moduleId) {
            var rec = tp.quizRecords[moduleId];
            if (rec && rec.highScore >= 70 && tp.completedModules.indexOf(moduleId) < 0) {
              tp.completedModules.push(moduleId); changed = true;
            }
          });
        });
        if (changed) localStorage.setItem('pega_lms_state', JSON.stringify(state));
      } catch (e) {}
    })();
  </script>

    })();
  </script>
